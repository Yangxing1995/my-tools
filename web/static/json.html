<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>JSON 格式化 - Wrench</title>
    <link rel="stylesheet" href="/static/style.css"/>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
</head>
<body data-page="json">
<div class="container">
    <div class="header">
        <div class="brand">
            <h1>JSON 格式化</h1>
            <div class="sub">格式化或压缩 JSON 数据</div>
        </div>
    </div>

    <div class="grid">
        <div class="card half">
            <h2>输入</h2>
            <div class="toolbar">
                <button class="btn primary" id="btnFormat">格式化</button>
                <button class="btn" id="btnMinify">压缩</button>
                <button class="btn" id="btnClear">清空</button>
                <button class="btn" id="btnFullscreenInput" title="全屏">全屏</button>
                <div class="small">快捷键：<span class="kbd">Ctrl</span>/<span class="kbd">Cmd</span> + <span
                        class="kbd">Enter</span></div>
            </div>
            <textarea class="textarea" id="input" placeholder='粘贴 JSON 数据，例如：

{"name":"test","age":18,"items":["a","b","c"]}

或

{
  "name": "test",
  "age": 18
}

也支持日志行里夹带 JSON：

2026-06-03T10:24:59.020615572+08:00 stderr F {"ok":true}'></textarea>
            <div id="status" class="status"></div>
        </div>

        <div class="card half">
            <h2>输出</h2>
            <div class="toolbar">
                <button class="btn" id="btnCopy" disabled>复制</button>
                <button class="btn" id="btnFullscreenOutput" title="全屏">全屏</button>
                <button class="btn" id="btnSave" disabled>保存文件</button>
                <button class="btn" id="btnExpandJSON" type="button">展开全部</button>
                <button class="btn" id="btnCollapseJSON" type="button">收起全部</button>
            </div>
            <div class="json-output-box">
                <textarea class="textarea" id="output" placeholder="格式化或压缩后的结果将显示在这里"></textarea>
                <div class="json-editor" id="jsonOutputEditor" hidden></div>
            </div>
        </div>

        <div class="card">
            <h2>说明</h2>
            <p>
                本工具支持格式化和压缩 JSON 数据，也支持从日志行或混杂文本中剔除非 JSON 内容后解析。
            </p>
            <p>
                <strong>格式化：</strong>将压缩的 JSON 转换为带缩进的可读格式；如果输入类似
                <span class="kbd">2026-06-03 stderr F {}</span>，
                会提取其中的 JSON 部分再格式化。
            </p>
            <p>
                <strong>压缩：</strong>移除 JSON 中的所有空白字符，生成最小化的 JSON 字符串。
            </p>
        </div>
    </div>
</div>

<script src="/static/utils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
