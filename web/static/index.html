<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Wrench</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
    <link rel="stylesheet" href="/static/style.css"/>
</head>
<body data-page="home">
<div class="container">
    <div class="header">
        <div class="brand">
            <h1>Wrench</h1>
            <div class="sub">工具入口</div>
        </div>
    </div>

    <main class="tool-board">
        <section class="tool-section">
            <div class="section-title">
                <h2 id="toolListTitle">全部工具</h2>
                <span id="toolResultCount" class="section-count"></span>
            </div>
            <div id="toolGroups" class="tool-groups"></div>
            <div id="emptyTools" class="empty-state" hidden>没有匹配的工具</div>
        </section>
    </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
